name: Career page watch

on:
  schedule:
    # GitHub cron is UTC only. 10:17 UTC = 2:17am PST (winter, standard time) / 3:17am PDT (summer)
    # Off the top of the hour on purpose: :00 is when GitHub's scheduler is busiest and runs start latest.
    - cron: "17 10 * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write # to commit state.json, history.json, new.html back to the repo

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # run all JS actions on Node 24

concurrency:
  group: career-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      dir: ${{ steps.loc.outputs.dir }}
    steps:
      - uses: actions/checkout@v5

      - name: Locate script folder
        id: loc
        run: |
          echo "Tracked files:"; git ls-files
          path=$(git ls-files | grep -E '(^|/)careers_watch\.py$' | head -n1)
          if [ -z "$path" ]; then echo "::error::careers_watch.py is not committed to this repo"; exit 1; fi
          dir=$(dirname "$path")
          echo "Using folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt
          else pip install requests beautifulsoup4 playwright; fi

      - name: Install headless browser
        run: python -m playwright install --with-deps chromium # for JavaScript-rendered career pages

      - name: Run watcher (Vishal, US)
        continue-on-error: true # a failure here must not block the other profile or the commit
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }} # secret, not a variable: variables show up in public run logs
          SHEET_GID: ${{ vars.SHEET_GID }}
          REGION: US
          US_ONLY: ${{ vars.US_ONLY }} # set repo variable US_ONLY=no to include roles outside the US
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          # ── Target domains: SWE / Data Eng / AI / Platform / Distributed Systems ──
          # ROLE_WORDS replaces the default broad regex; each comma-separated piece is a regex alternation.
          ROLE_WORDS: >-
            software engineer,data engineer,ml engineer,machine learning engineer,
            ai engineer,platform engineer,infrastructure engineer,
            site reliability engineer,sre,backend engineer,frontend engineer,
            full.stack engineer,distributed systems,mlops engineer,
            analytics engineer,applied scientist,research engineer,
            engineering manager,staff engineer,principal engineer,
            cloud engineer,devops engineer,data scientist,systems engineer,
            software developer,founding engineer,ai researcher
          # JOB_WORDS adds tech buzzwords on top of ROLE_WORDS (title must still match one of the above).
          JOB_WORDS: llm,genai,rag,spark,kafka,flink,kubernetes,airflow,dbt,pytorch
          # EXCLUDE_TITLES: drop any title containing one of these words (comma-separated regex pieces).
          # Non-tech noise + roles clearly requiring 7+ YoE (staff, principal, director, VP, fellow).
          EXCLUDE_TITLES: >-
            maintenance,janitor,custodian,nurs,chef,driver,accountant,
            paralegal,attorney,physician,surgeon,radiologist,dentist,pharmacist,
            financial analyst,tax analyst,sales representative,realtor,
            hvac,electrician,plumber,security guard,warehouse,
            staff engineer,principal engineer,distinguished engineer,
            fellow engineer,director of engineering,director of,
            vp of,vp ,head of,senior staff,senior principal,
            engineering director,chief architect
        run: python careers_watch.py

      - name: Commit results
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in state.json history.json new.html; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Career watch: $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
            git push
          fi

  deploy:
    needs: watch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }} # latest commit, including the bot's results from the watch job

      - name: Debug — verify files before deploy
        run: |
          echo "=== watch job dir output: '${{ needs.watch.outputs.dir }}' ==="
          echo "=== repo root contents ==="
          ls -la
          echo "=== pipeline/ contents ==="
          ls -la "${{ needs.watch.outputs.dir }}/" || echo "ERROR: dir not found"
          echo "=== git tracked files ==="
          git ls-files "${{ needs.watch.outputs.dir }}/"

      - name: Build site
        run: |
          set -euo pipefail
          DIR="${{ needs.watch.outputs.dir }}"
          if [ -z "$DIR" ]; then
            echo "::error::watch job did not output a dir — check the 'Locate script folder' step"
            exit 1
          fi
          if [ ! -f "$DIR/new.html" ]; then
            echo "::error::$DIR/new.html not found in checkout — ls of $DIR:"
            ls -la "$DIR/" || true
            exit 1
          fi
          mkdir site
          cp "$DIR/new.html" site/index.html
          cp "$DIR/report.css" site/report.css
          echo "Build site OK — $(wc -c < site/index.html) bytes"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
